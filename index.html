<!doctype html>
<html lang="en" data-theme="sakura">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sakulime-ui</title>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/themes/sakura.css" />
    <link rel="stylesheet" href="/src/themes/dark.css" />
    <link rel="stylesheet" href="/src/css/button.css" />
    <link rel="stylesheet" href="/src/css/icon.css" />
    <script type="module" src="/src/elements/index.ts"></script>
    <style>
      body {
        background: var(--sl-bg);
        color: var(--sl-text);
        padding: var(--sl-space-xl);
      }
      section {
        margin-block: var(--sl-space-xl);
      }
      h1,
      h2 {
        margin: 0 0 var(--sl-space-sm);
      }
      .row {
        display: flex;
        gap: var(--sl-space-md);
        align-items: center;
        flex-wrap: wrap;
        margin-block: var(--sl-space-sm);
      }
    </style>
  </head>
  <body>
    <h1>sakulime-ui</h1>
    <label>
      Theme:
      <select id="theme">
        <option value="sakura">sakura</option>
        <option value="dark">dark</option>
      </select>
    </label>

    <section>
      <h2>Button — class</h2>
      <div class="row">
        <button class="sl-button sl-button--primary sl-button--md">primary</button>
        <button class="sl-button sl-button--secondary sl-button--md">secondary</button>
        <button class="sl-button sl-button--success sl-button--md">success</button>
        <button class="sl-button sl-button--warning sl-button--md">warning</button>
        <button class="sl-button sl-button--danger sl-button--md">danger</button>
      </div>
      <div class="row">
        <button class="sl-button sl-button--primary sl-button--ghost">ghost</button>
        <button class="sl-button sl-button--primary sl-button--underline">underline</button>
        <button class="sl-button sl-button--primary sl-button--md is-invert">invert</button>
        <button class="sl-button sl-button--primary sl-button--md" disabled>disabled</button>
      </div>
      <div class="row">
        <button class="sl-button sl-button--primary sl-button--sm">sm</button>
        <button class="sl-button sl-button--primary sl-button--md">md</button>
        <button class="sl-button sl-button--primary sl-button--lg">lg</button>
      </div>
    </section>

    <section>
      <h2>Button — element</h2>
      <div class="row">
        <sl-button tone="primary">primary</sl-button>
        <sl-button tone="danger" size="lg" invert>invert lg</sl-button>
        <sl-button variant="underline">underline</sl-button>
        <sl-button disabled>disabled</sl-button>
      </div>
    </section>

    <section>
      <h2>Icon</h2>
      <div class="row">
        <sl-icon name="check" tone="success"></sl-icon>
        <sl-icon name="x" tone="danger"></sl-icon>
        <sl-icon name="info" tone="primary"></sl-icon>
        <sl-icon name="alert" tone="warning" size="lg"></sl-icon>
        <span class="sl-icon sl-icon--lg sl-icon--secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </div>
    </section>

    <script type="module">
      document.getElementById("theme").addEventListener("change", (e) => {
        document.documentElement.dataset.theme = e.target.value;
      });
    </script>
  </body>
</html>
