<!doctype html>
<html lang="en" data-theme="sakura">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sakulime-ui</title>
    <link rel="stylesheet" href="/packages/core/src/index.css" />
    <link rel="stylesheet" href="/packages/tokens/src/tokens.css" />
    <link rel="stylesheet" href="/packages/tokens/src/themes/sakura.css" />
    <link rel="stylesheet" href="/packages/tokens/src/themes/dark.css" />
    <link rel="stylesheet" href="/packages/core/src/css/button.css" />
    <link rel="stylesheet" href="/packages/core/src/css/icon.css" />
    <link rel="stylesheet" href="/packages/core/src/css/modifiers.css" />
    <link rel="stylesheet" href="/packages/layout/src/layout.css" />
    <style>
      body {
        background: var(--sl-bg);
        color: var(--sl-text);
        padding: var(--sl-space-xl);
      }
      section {
        margin-block: var(--sl-space-xl);
      }
      h1,
      h2 {
        margin: 0 0 var(--sl-space-sm);
      }
      .row {
        display: flex;
        gap: var(--sl-space-md);
        align-items: center;
        flex-wrap: wrap;
        margin-block: var(--sl-space-sm);
      }
    </style>
  </head>
  <body>
    <h1>sakulime-ui</h1>
    <label>
      Theme:
      <select id="theme">
        <option value="sakura">sakura</option>
        <option value="dark">dark</option>
      </select>
    </label>

    <section>
      <h2>Button</h2>
      <div class="row">
        <button sl-button sl-tone="primary" sl-size="md">primary</button>
        <button sl-button sl-tone="secondary" sl-size="md">secondary</button>
        <button sl-button sl-tone="success" sl-size="md">success</button>
        <button sl-button sl-tone="warning" sl-size="md">warning</button>
        <button sl-button sl-tone="danger" sl-size="md">danger</button>
      </div>
      <div class="row">
        <button sl-button sl-tone="primary" sl-variant="ghost">ghost</button>
        <button sl-button sl-tone="primary" sl-variant="underline">underline</button>
        <button sl-button sl-tone="primary" sl-size="md" sl-invert>invert</button>
        <button sl-button sl-tone="primary" sl-size="md" disabled>disabled</button>
        <a href="#" sl-button sl-tone="secondary" sl-size="md">on anchor</a>
      </div>
      <div class="row">
        <button sl-button sl-tone="primary" sl-size="sm">sm</button>
        <button sl-button sl-tone="primary" sl-size="md">md</button>
        <button sl-button sl-tone="primary" sl-size="lg">lg</button>
        <button sl-button sl-tone="primary" sl-size="md" sl-radius="full">radius-full</button>
      </div>
    </section>

    <section>
      <h2>Layout</h2>
      <div class="sl-grid sl-gap-md" style="grid-template-columns:repeat(3,1fr)">
        <button sl-button sl-tone="primary" sl-size="md">a</button>
        <button sl-button sl-tone="secondary" sl-size="md">b</button>
        <button sl-button sl-tone="success" sl-size="md">c</button>
        <button sl-button sl-tone="warning" sl-size="md">d</button>
        <button sl-button sl-tone="danger" sl-size="md">e</button>
        <button sl-button sl-tone="primary" sl-variant="ghost">f</button>
      </div>
      <div class="sl-cluster sl-gap-sm" style="margin-top:var(--sl-space-lg)">
        <button sl-button sl-tone="primary" sl-size="sm">cluster</button>
        <button sl-button sl-tone="secondary" sl-size="sm">wraps</button>
        <button sl-button sl-tone="success" sl-size="sm">items</button>
      </div>
    </section>

    <section>
      <h2>Icon — helper</h2>
      <div class="row" id="icon-row"></div>
      <h2>Icon — inline markup</h2>
      <div class="row">
        <span sl-icon sl-size="lg" sl-tone="secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </div>
    </section>

    <script type="module">
      import { icon } from "/packages/core/src/icons/index.ts";

      document.getElementById("icon-row").innerHTML = [
        icon("check", { "sl-tone": "success" }),
        icon("x", { "sl-tone": "danger" }),
        icon("info", { "sl-tone": "primary" }),
        icon("alert", { "sl-tone": "warning", "sl-size": "lg" }),
      ].join("");

      document.getElementById("theme").addEventListener("change", (e) => {
        document.documentElement.dataset.theme = e.target.value;
      });
    </script>
  </body>
</html>
