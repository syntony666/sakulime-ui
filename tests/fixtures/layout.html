<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sl layout fixture</title>
<link rel="stylesheet" href="../../packages/theme/dist/sakulime.min.css">
<link rel="stylesheet" href="../../packages/core/dist/index.min.css">
<link rel="stylesheet" href="../../packages/layout/dist/index.min.css">
<style>body { font-family: system-ui, sans-serif; } #probe { position: absolute; visibility: hidden; }</style>
</head>
<body>

<!-- container -->
<div sl-container id="cont-def"><span>c</span></div>
<div sl-container="sm" id="cont-sm"><span>c</span></div>
<div sl-container="lg" id="cont-lg"><span>c</span></div>
<div sl-container sl-pad="sm" id="cont-pad"><span>c</span></div>
<div sl-container sl-pad="none" id="cont-padn"><span>c</span></div>
<div sl-card sl-pad="sm"><div sl-container id="cont-seal"><span>c</span></div></div>

<!-- stack: gap comes from sl-gap only -->
<div sl-stack id="st-def"><div id="st-c1">a</div><div>b</div></div>
<!-- gap axis is uniform value→step mapping; bounds prove the table -->
<div sl-stack sl-gap="xs" id="st-xs"><div>a</div><div>b</div></div>
<div sl-stack sl-gap="5xl" id="st-5xl"><div>a</div><div>b</div></div>
<!-- --sl-stack-gap is the non-inheriting escape hatch: it must not
     leak into the nested bare stack -->
<div sl-stack style="--sl-stack-gap: var(--sl-5xl)"><div sl-stack id="st-inner"><div>a</div><div>b</div></div></div>
<!-- sl-gap IS meant to inherit -->
<div sl-gap="xl"><div sl-stack id="st-inherit"><div>a</div><div>b</div></div></div>
<div sl-stack sl-gap="lg"><div sl-stack id="st-inherit2"><div>a</div><div>b</div></div></div>

<!-- content: prose column keeps child margins, adds sibling rhythm -->
<div sl-content id="ct-def"><h3 id="ct-h">t</h3><div id="ct-1">a</div><div id="ct-2">b</div></div>
<div sl-content sl-gap="2xl" id="ct-gap"><div id="ct-g1">a</div><div id="ct-g2">b</div></div>

<!-- wrap -->
<div sl-wrap id="wrap-def"><div>a</div><div>b</div></div>
<div sl-wrap sl-gap="none" id="wrap-gn"><div>a</div><div>b</div></div>
<div sl-wrap sl-gap="lg" id="wrap-lg"><div>a</div><div>b</div></div>
<div sl-wrap id="wrap-min"><div id="wrap-mc">a</div></div>
<div sl-wrap sl-justify="end" id="wrap-end"><div>a</div><div>b</div></div>
<div sl-wrap sl-justify="center" id="wrap-ctr"><div>a</div><div>b</div></div>
<div sl-wrap sl-justify="between" id="wrap-btw"><div>a</div><div>b</div></div>
<div sl-wrap sl-justify="around" id="wrap-ard"><div>a</div><div>b</div></div>
<div sl-wrap sl-justify="evenly" id="wrap-evn"><div>a</div><div>b</div></div>
<div sl-justify="end"><div sl-wrap id="wrap-seal"><div>a</div><div>b</div></div></div>
<div sl-stack sl-justify="between" id="st-jbtw"><div>a</div><div>b</div></div>
<!-- sl-align: container sets align-items, marked child gets align-self -->
<div sl-wrap sl-align="end" id="wrap-aend"><div>a</div><div>b</div></div>
<div sl-wrap sl-align="stretch" id="wrap-astr"><div>a</div><div>b</div></div>
<div sl-wrap id="wrap-aparent"><div sl-align="end" id="wrap-aself">a</div><div>b</div></div>
<div sl-stack sl-align="center" id="st-actr"><div>a</div><div>b</div></div>
<div sl-stack id="st-aparent"><div sl-align="start" id="st-aself">a</div><div>b</div></div>
<div sl-align="end"><div sl-stack id="st-aseal"><div>a</div><div>b</div></div></div>

<!-- grid (640px track width makes counts deterministic) -->
<div style="width:640px">
  <div sl-grid id="gr-auto"><div>a</div><div>b</div><div>c</div><div>d</div></div>
  <div sl-grid sl-grid-cols="4" id="gr-4"><div>a</div><div>b</div><div>c</div><div>d</div></div>
  <div sl-grid sl-grid-cols="4" sl-justify="center" id="gr-jctr"><div>a</div></div>
  <div sl-grid sl-grid-cols="4" sl-align="center" id="gr-actr"><div>a</div></div>
  <div sl-grid sl-grid-cols="4"><div sl-align="end" id="gr-aself">a</div></div>
  <div sl-grid sl-grid-cols="4"><div sl-justify="end" id="gr-jself">a</div></div>
  <div sl-grid id="gr-asp"><div sl-grid--span="2" id="spa">a</div><div>b</div></div>
  <div sl-grid sl-grid-cols="4" id="gr-span">
    <div sl-grid--span="8" id="sp8">over</div>
    <div sl-grid--span="full" id="spf">full</div>
    <div sl-grid--span="2" id="sp2">two</div>
    <div sl-grid--span="1" id="sp1">one</div>
    <div sl-grid--span id="spb">bare</div>
    <div>x</div>
  </div>
  <div sl-grid sl-grid-cols="2" id="gr-outer">
    <div sl-grid id="gr-inner"><div>i</div><div>j</div></div>
    <div>sib</div>
  </div>
</div>

<!-- bar -->
<div sl-bar id="bar-plain">band</div>
<div sl-bar="top" id="bar-top">
  <div sl-bar--start id="bz-s">s</div>
  <div sl-bar--center id="bz-c">center</div>
  <div sl-bar--end id="bz-e">e</div>
</div>
<div sl-bar id="bar-sparse">
  <div sl-bar--center id="bs-c">center</div>
  <div sl-bar--end id="bs-e">e</div>
</div>
<div sl-bar="top" sl-bar-fixed id="bar-fix">fixed</div>
<div sl-bar="bottom" sl-bar-fixed id="bar-fixb">fixed bottom</div>
<div sl-bar="bottom" id="bar-bot">bottom</div>
<div sl-bar="top" sl-pad="lg" id="bar-pad">padded</div>

<!-- above-breakpoint — this fixture runs at 1280px, past all three
     breakpoints: every hide stays, every show is gone, cols-lg is inert -->
<div sl-hide-sm id="ah-sm">x</div>
<div sl-hide-md id="ah-md">x</div>
<div sl-hide-lg id="ah-lg">x</div>
<div sl-show-sm id="as-sm">x</div>
<div sl-show-md id="as-md">x</div>
<div sl-show-lg id="as-lg">x</div>
<div sl-grid sl-grid-cols="4" sl-grid-cols-lg="2" id="ag-cols"><div>a</div><div>b</div><div>c</div><div>d</div></div>

<!-- floats -->
<div sl-float id="t-def"><div sl-notice="fit">a</div></div>
<div sl-float="bottom start" id="t-bs"><div sl-notice="fit">a</div></div>
<div sl-float="bottom center" id="t-bc"><div sl-notice="fit">a</div></div>
<div sl-float="bottom end" id="t-be"><div sl-notice="fit">a</div></div>
<div sl-float="top start" id="t-ts"><div sl-notice="fit">a</div></div>
<div sl-float="top center" id="t-tc"><div sl-notice="fit">a</div></div>
<div sl-float="top end" id="t-te"><div sl-notice="fit">a</div></div>
<div sl-float="start" id="t-partial"><div sl-notice="fit">a</div></div>
<div sl-float="bogus" id="t-bogus"><div sl-notice="fit">a</div></div>
<div sl-float sl-align="center" id="t-alc"><div sl-notice="fit">a</div></div>
<div sl-align="end"><div sl-float id="t-alseal"><div sl-notice="fit">a</div></div></div>

<!-- sidebar: rail position follows DOM order -->
<div sl-sidebar id="sb" style="width:800px">
  <div sl-sidebar--rail id="sb-rail">rail</div>
  <div id="sb-main">main</div>
</div>
<div sl-sidebar id="sb2" style="width:800px">
  <div id="sb2-main">m</div>
  <div sl-sidebar--rail id="sb2-rail">r</div>
</div>
<div sl-sidebar id="sb4" style="width:300px">
  <div sl-sidebar--rail id="sb4-rail">r</div>
  <div id="sb4-main">m</div>
</div>
<div sl-sidebar id="sb3" style="width:1400px">
  <div sl-sidebar--rail id="sb3-l">l</div>
  <div id="sb3-main">m</div>
  <div sl-sidebar--rail id="sb3-r">r</div>
</div>

<div id="probe"></div>
<pre id="results"></pre>
<script src="helpers.js"></script>
<script>
function main() {
  /* ---- container ---- */
  near('container def pad = --sl-lg', cs('cont-def', 'padding-left'), varPx('--sl-lg'));
  near('container sl-pad=sm', cs('cont-pad', 'padding-left'), varPx('--sl-md'));
  eq('container sl-pad=none', cs('cont-padn', 'padding-left'), '0px');
  near('container sealed from card sl-pad', cs('cont-seal', 'padding-left'), varPx('--sl-lg'));
  near('container def max-w = --sl-container-md', cs('cont-def', 'max-width'), varPx('--sl-container-md'));
  near('container sm max-w = --sl-container-sm', cs('cont-sm', 'max-width'), varPx('--sl-container-sm'));
  near('container lg max-w = --sl-container-lg', cs('cont-lg', 'max-width'), varPx('--sl-container-lg'));
  rec('container centered', cs('cont-def', 'margin-left') + ' / ' + cs('cont-def', 'margin-right'), 'equal >0',
    px(cs('cont-def', 'margin-left')) > 0 && cs('cont-def', 'margin-left') === cs('cont-def', 'margin-right'));

  /* ---- stack ---- */
  eq('stack display', cs('st-def', 'display'), 'flex');
  eq('stack column', cs('st-def', 'flex-direction'), 'column');
  near('stack def gap = --sl-md', cs('st-def', 'row-gap'), varPx('--sl-md'));
  eq('stack child margin zeroed', cs('st-c1', 'margin-top'), '0px');
  near('stack xs gap = --sl-xs', cs('st-xs', 'row-gap'), varPx('--sl-xs'));
  near('stack 5xl gap = --sl-5xl', cs('st-5xl', 'row-gap'), varPx('--sl-5xl'));
  /* the --sl-*-gap slots are non-inheriting — the outer 5xl escape
     hatch must not reach the nested bare stack, which reads md */
  near('nested stack sealed to md', cs('st-inner', 'row-gap'), varPx('--sl-md'));
  neq('nested stack not 5xl', cs('st-inner', 'row-gap'), varPx('--sl-5xl') + 'px');
  /* --sl-gap is a plain var: it IS meant to inherit */
  near('ancestor sl-gap inherits in', cs('st-inherit', 'row-gap'), varPx('--sl-xl'));
  near('sl-gap=lg inherits in', cs('st-inherit2', 'row-gap'), varPx('--sl-lg'));

  /* ---- content ---- */
  eq('content display block', cs('ct-def', 'display'), 'block');
  eq('content first margin cleared', cs('ct-h', 'margin-top'), '0px');
  near('content sibling rhythm', cs('ct-2', 'margin-top'), varPx('--sl-md'));
  near('content sl-gap=2xl rhythm', cs('ct-g2', 'margin-top'), varPx('--sl-2xl'));

  /* ---- row ---- */
  eq('row display', cs('wrap-def', 'display'), 'flex');
  eq('row wrap', cs('wrap-def', 'flex-wrap'), 'wrap');
  eq('row align center', cs('wrap-def', 'align-items'), 'center');
  near('row def gap = --sl-md', cs('wrap-def', 'column-gap'), varPx('--sl-md'));
  eq('wrap justify end', cs('wrap-end', 'justify-content'), 'end');
  eq('wrap justify center', cs('wrap-ctr', 'justify-content'), 'center');
  eq('wrap justify between', cs('wrap-btw', 'justify-content'), 'space-between');
  eq('wrap justify around', cs('wrap-ard', 'justify-content'), 'space-around');
  eq('wrap justify evenly', cs('wrap-evn', 'justify-content'), 'space-evenly');
  eq('wrap sealed from ancestor justify', cs('wrap-seal', 'justify-content'), cs('wrap-def', 'justify-content'));
  eq('stack justify between', cs('st-jbtw', 'justify-content'), 'space-between');
  eq('wrap align end', cs('wrap-aend', 'align-items'), 'end');
  eq('wrap align stretch', cs('wrap-astr', 'align-items'), 'stretch');
  eq('wrap child align-self end', cs('wrap-aself', 'align-self'), 'end');
  eq('stack align center', cs('st-actr', 'align-items'), 'center');
  eq('stack child align-self start', cs('st-aself', 'align-self'), 'start');
  eq('stack sealed from ancestor align', cs('st-aseal', 'align-items'), 'stretch');
  near('row sl-gap=lg', cs('wrap-lg', 'column-gap'), varPx('--sl-lg'));
  eq('wrap sl-gap=none', cs('wrap-gn', 'column-gap'), '0px');
  eq('row child min-inline 0', cs('wrap-mc', 'min-width'), '0px');

  /* ---- grid ---- */
  eq('grid display', cs('gr-auto', 'display'), 'grid');
  eq('grid auto-fill tracks = 2 @640px', tracks('gr-auto'), 2);
  eq('grid cols=4 tracks', tracks('gr-4'), 4);
  eq('grid justify=items center', cs('gr-jctr', 'justify-items'), 'center');
  eq('grid align=items center', cs('gr-actr', 'align-items'), 'center');
  eq('grid child align-self end', cs('gr-aself', 'align-self'), 'end');
  eq('grid child justify-self end', cs('gr-jself', 'justify-self'), 'end');
  /* auto-fill mode: --_cap stays 12 so span 2 spans real tracks —
     at 2 tracks wide that's the whole row */
  near('auto-fill span 2 covers row', rect('spa').width, rect('gr-asp').width, 2);
  near('span 8 clamps to 4 tracks', rect('sp8').width, rect('gr-span').width, 2);
  near('span full covers grid', rect('spf').width, rect('gr-span').width, 2);
  near('bare span = full row', rect('spb').width, rect('gr-span').width, 2);
  rec('span 2 = 2 tracks + 1 gap', rect('sp2').width + 'px', '~(640-3*12)/4*2+12',
    Math.abs(rect('sp2').width - (2 * ((640 - 3 * varPx('--sl-md')) / 4) + varPx('--sl-md'))) < 2);
  near('span 1 = single track', rect('sp1').width, (640 - 3 * varPx('--sl-md')) / 4, 2);
  /* self-default seal — inner bare grid must not inherit the parent's cols */
  eq('inner grid auto-fill 1 track', tracks('gr-inner'), 1);
  neq('inner grid != parent tracks', tracks('gr-inner'), tracks('gr-outer'));
  eq('outer grid tracks = 2', tracks('gr-outer'), 2);

  /* ---- bar ---- */
  eq('bar display grid', cs('bar-plain', 'display'), 'grid');
  near('bar min-block = 3.5rem', cs('bar-plain', 'min-height'), 56);
  near('bar pad = --sl-md block', cs('bar-plain', 'padding-top'), varPx('--sl-md'));
  eq('bar top sticky', cs('bar-top', 'position'), 'sticky');
  eq('bar top border-bottom', cs('bar-top', 'border-bottom-width'), '1px');
  /* the middle column is auto-width, so --center lands dead-center
     even when the sides are unequal */
  near('bar start at left+pad', rect('bz-s').left, rect('bar-top').left + varPx('--sl-lg'), 2);
  near('bar end at right-pad', rect('bz-e').right, rect('bar-top').right - varPx('--sl-lg'), 2);
  near('bar center dead-center',
    rect('bz-c').left + rect('bz-c').width / 2,
    rect('bar-top').left + rect('bar-top').width / 2, 2);
  near('bar center dead-center (sparse zones)',
    rect('bs-c').left + rect('bs-c').width / 2,
    rect('bar-sparse').left + rect('bar-sparse').width / 2, 2);
  near('bar sparse end at right-pad', rect('bs-e').right, rect('bar-sparse').right - varPx('--sl-lg'), 2);
  eq('bar fixed', cs('bar-fix', 'position'), 'fixed');
  eq('bar bottom fixed', cs('bar-fixb', 'position'), 'fixed');
  near('fixed top bar pads body', getComputedStyle(document.body).paddingTop, 56, 1);
  near('fixed bottom bar pads body', getComputedStyle(document.body).paddingBottom, 56, 1);
  eq('body comp gated to screen', mediaOf('body:has([sl-bar="top"][sl-bar-fixed])'), 'screen');
  eq('body comp bottom gated to screen', mediaOf('body:has([sl-bar="bottom"][sl-bar-fixed])'), 'screen');
  rec('bar top pad carries safe-area', declOf('[sl-bar="top"]', 'padding-block-start'),
    'contains safe-area-inset-top', (declOf('[sl-bar="top"]', 'padding-block-start') || '').includes('safe-area-inset-top'));
  rec('body comp carries safe-area', declOf('body:has([sl-bar="top"][sl-bar-fixed])', 'padding-block-start'),
    'contains safe-area-inset-top', (declOf('body:has([sl-bar="top"][sl-bar-fixed])', 'padding-block-start') || '').includes('safe-area-inset-top'));
  rec('body comp bottom carries safe-area', declOf('body:has([sl-bar="bottom"][sl-bar-fixed])', 'padding-block-end'),
    'contains safe-area-inset-bottom', (declOf('body:has([sl-bar="bottom"][sl-bar-fixed])', 'padding-block-end') || '').includes('safe-area-inset-bottom'));

  /* above-breakpoint — at 1280px every breakpoint block is inert:
     hide stays visible, show is gone, cols-lg doesn't apply */
  eq('hide-sm visible above bp', cs('ah-sm', 'display'), 'block');
  eq('hide-md visible above bp', cs('ah-md', 'display'), 'block');
  eq('hide-lg visible above bp', cs('ah-lg', 'display'), 'block');
  eq('show-sm gone above bp', cs('as-sm', 'display'), 'none');
  eq('show-md gone above bp', cs('as-md', 'display'), 'none');
  eq('show-lg gone above bp', cs('as-lg', 'display'), 'none');
  eq('cols-lg inert above bp', tracks('ag-cols'), 4);

  /* media presence — print and reduced-motion rules must ship;
     a deleted block would pass every computed assertion silently */
  rec('print media present', mediaList().filter(m => m.includes('print')).join(','),
    'contains print', mediaList().some(m => /print/.test(m)));
  rec('reduced-motion media present', mediaList().filter(m => m.includes('prefers-reduced-motion')).join(','),
    'contains prefers-reduced-motion', mediaList().some(m => /prefers-reduced-motion/.test(m)));
  eq('float static in print', mediaDecl('[sl-float]', 'position', 'print'), 'static');
  eq('fixed bar static in print', mediaDecl('[sl-bar][sl-bar-fixed]', 'position', 'print'), 'static');
  eq('bar bottom sticky', cs('bar-bot', 'position'), 'sticky');
  eq('bar bottom border-top', cs('bar-bot', 'border-top-width'), '1px');
  near('bar sl-pad=lg block pad', cs('bar-pad', 'padding-top'), varPx('--sl-2xl'));

  /* ---- float ---- */
  eq('float fixed', cs('t-def', 'position'), 'fixed');
  near('float width 22rem', rect('t-def').width, Math.min(352, vw() - 32), 2);
  near('float def bottom-end right', rect('t-def').right, vw() - varPx('--sl-lg'), 2);
  near('float def bottom-end bottom', rect('t-def').bottom, vh() - varPx('--sl-lg'), 2);
  near('float bottom start left', rect('t-bs').left, varPx('--sl-lg'), 2);
  near('float bottom start bottom', rect('t-bs').bottom, vh() - varPx('--sl-lg'), 2);
  near('float bottom center x', rect('t-bc').left + rect('t-bc').width / 2, vw() / 2, 2);
  near('float bottom center bottom', rect('t-bc').bottom, vh() - varPx('--sl-lg'), 2);
  near('float bottom end right', rect('t-be').right, vw() - varPx('--sl-lg'), 2);
  near('float top start left', rect('t-ts').left, varPx('--sl-lg'), 2);
  near('float top start top', rect('t-ts').top, varPx('--sl-lg'), 2);
  near('float top center x', rect('t-tc').left + rect('t-tc').width / 2, vw() / 2, 2);
  near('float top center top', rect('t-tc').top, varPx('--sl-lg'), 2);
  near('float top end right', rect('t-te').right, vw() - varPx('--sl-lg'), 2);
  near('float top end top', rect('t-te').top, varPx('--sl-lg'), 2);
  near('float partial "start" left', rect('t-partial').left, varPx('--sl-lg'), 2);
  near('float partial "start" bottom', rect('t-partial').bottom, vh() - varPx('--sl-lg'), 2);
  near('float bogus value falls back right', rect('t-bogus').right, vw() - varPx('--sl-lg'), 2);
  near('float bogus value falls back bottom', rect('t-bogus').bottom, vh() - varPx('--sl-lg'), 2);
  eq('float align center', cs('t-alc', 'align-items'), 'center');
  rec('float end carries safe-area-right', declOf('[sl-float]', 'inset-inline-end'),
    'contains safe-area-inset-right', (declOf('[sl-float]', 'inset-inline-end') || '').includes('safe-area-inset-right'));
  rec('float start carries safe-area-left', declOf('[sl-float~="start"]', 'inset-inline-start'),
    'contains safe-area-inset-left', (declOf('[sl-float~="start"]', 'inset-inline-start') || '').includes('safe-area-inset-left'));
  eq('float sealed from ancestor align', cs('t-alseal', 'align-items'), 'stretch');
  eq('float print is static', mediaDecl('[sl-float]', 'position', 'print'), 'static');
  eq('float print releases clamp', mediaDecl('[sl-float]', 'max-block-size', 'print'), 'none');
  eq('float print releases scroll', mediaDecl('[sl-float]', 'overflow-block', 'print'), 'visible');

  /* ---- sidebar ---- */
  eq('sidebar flex', cs('sb', 'display'), 'flex');
  eq('sidebar wrap', cs('sb', 'flex-wrap'), 'wrap');
  near('sidebar rail 16rem', rect('sb-rail').width, 256, 4);
  near('sidebar def gap = --sl-lg', cs('sb', 'column-gap'), varPx('--sl-lg'));
  /* DOM order: rail first = leading edge, rail last = trailing edge */
  rec('rail first sits left', rect('sb-rail').left + 'px', '< main', rect('sb-rail').left < rect('sb-main').left);
  rec('rail last sits right', rect('sb2-rail').left + 'px', '> main', rect('sb2-rail').left > rect('sb2-main').left);
  rec('two rails flank main', rect('sb3-l').left + '<' + rect('sb3-main').left + '<' + rect('sb3-r').left,
    'l<main<r', rect('sb3-l').left < rect('sb3-main').left && rect('sb3-r').left > rect('sb3-main').left);
  /* narrow container: main's 55% min + rail basis + gap > width, so
     the rail wraps onto its own line above the content */
  rec('narrow sidebar wraps rail above main',
    rect('sb4-rail').top + '<' + rect('sb4-main').top,
    'rail row above main row', rect('sb4-rail').bottom <= rect('sb4-main').top + 1);
}
</script>
</body>
</html>
