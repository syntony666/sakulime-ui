<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sl layout fixture</title>
<link rel="stylesheet" href="../../packages/theme/dist/sakulime.min.css">
<link rel="stylesheet" href="../../packages/core/dist/index.min.css">
<link rel="stylesheet" href="../../packages/layout/dist/index.min.css">
<style>body { font-family: system-ui, sans-serif; } #probe { position: absolute; visibility: hidden; }</style>
</head>
<body>

<!-- container -->
<div sl-container id="cont-def"><span>c</span></div>
<div sl-container="sm" id="cont-sm"><span>c</span></div>
<div sl-container="lg" id="cont-lg"><span>c</span></div>

<!-- stack scale + seal + flow + cols -->
<div sl-stack id="st-def"><div id="st-c1">a</div><div>b</div></div>
<div sl-stack="xs" id="st-xs"><div>a</div><div>b</div></div>
<div sl-stack="sm" id="st-sm"><div>a</div><div>b</div></div>
<div sl-stack="md" id="st-md"><div>a</div><div>b</div></div>
<div sl-stack="lg" id="st-lg"><div>a</div><div>b</div></div>
<div sl-stack="xl" id="st-xl"><div>a</div><div>b</div></div>
<div sl-stack="2xl" id="st-2xl"><div>a</div><div>b</div></div>
<div sl-stack="3xl" id="st-3xl"><div>a</div><div>b</div></div>
<div sl-stack="4xl" id="st-4xl"><div>a</div><div>b</div></div>
<div sl-stack="5xl" id="st-5xl"><div>a</div><div>b</div></div>
<div sl-stack sl-gap="2xl" id="st-gap"><div>a</div><div>b</div></div>
<div sl-stack="lg"><div sl-stack id="st-inner"><div>a</div><div>b</div></div></div>
<div sl-gap="xl"><div sl-stack id="st-inherit"><div>a</div><div>b</div></div></div>
<div sl-stack sl-flow id="st-flow"><div id="fl-1">a</div><div id="fl-2">b</div></div>
<div sl-stack sl-cols="3" id="st-cols"><div>a</div><div>b</div><div>c</div><div>d</div></div>

<!-- row -->
<div sl-row id="row-def"><div>a</div><div>b</div></div>
<div sl-row="lg" id="row-lg"><div>a</div><div>b</div></div>
<div sl-row id="row-z" style="width:600px">
  <div sl-place="start" id="rz-s">s</div>
  <div sl-place="center" id="rz-c">c</div>
  <div sl-place="end" id="rz-e">e</div>
</div>

<!-- grid (640px track width makes counts deterministic) -->
<div style="width:640px">
  <div sl-grid id="gr-auto"><div>a</div><div>b</div><div>c</div><div>d</div></div>
  <div sl-grid sl-cols="4" id="gr-4"><div>a</div><div>b</div><div>c</div><div>d</div></div>
  <div sl-grid sl-cols="4" id="gr-span">
    <div sl-span="8" id="sp8">over</div>
    <div sl-span="full" id="spf">full</div>
    <div sl-span="2" id="sp2">two</div>
    <div>x</div>
  </div>
  <div sl-grid sl-cols="2" id="gr-outer">
    <div sl-grid id="gr-inner"><div>i</div><div>j</div></div>
    <div>sib</div>
  </div>
</div>

<!-- bar -->
<div sl-bar id="bar-plain">band</div>
<div sl-bar="top" id="bar-top">
  <div sl-place="start" id="bz-s">s</div>
  <div sl-place="center" id="bz-c">c</div>
  <div sl-place="end" id="bz-e">e</div>
</div>
<div sl-bar="top" sl-fixed id="bar-fix">fixed</div>
<div sl-bar="top" sl-static id="bar-stat">static</div>
<div sl-bar="bottom" id="bar-bot">bottom</div>

<!-- toasts -->
<div sl-toast id="t-def"><div sl-notice="fit">a</div></div>
<div sl-toast="bottom-start" id="t-bs"><div sl-notice="fit">a</div></div>
<div sl-toast="bottom-center" id="t-bc"><div sl-notice="fit">a</div></div>
<div sl-toast="bottom-end" id="t-be"><div sl-notice="fit">a</div></div>
<div sl-toast="top-start" id="t-ts"><div sl-notice="fit">a</div></div>
<div sl-toast="top-center" id="t-tc"><div sl-notice="fit">a</div></div>
<div sl-toast="top-end" id="t-te"><div sl-notice="fit">a</div></div>
<div sl-toast="start" id="t-legacy"><div sl-notice="fit">a</div></div>

<!-- place -->
<div id="pl-wrap" style="width:500px">
  <div sl-place="end" id="pl-end" style="width:80px;height:10px">e</div>
  <div sl-place="start" id="pl-start" style="width:80px;height:10px">s</div>
  <div sl-place="center" id="pl-center" style="width:80px;height:10px">c</div>
</div>
<div sl-stack id="pl-stack" style="height:200px">
  <div sl-place="middle end" id="pl-me" style="width:80px;height:40px">me</div>
</div>
<div sl-stack id="pl-stack2" style="height:200px">
  <div style="height:40px">top item</div>
  <div sl-place="bottom" id="pl-bot" style="height:40px">b</div>
</div>

<!-- sidebar -->
<div sl-with-sidebar id="sb" style="width:800px">
  <div sl-sidebar id="sb-rail">rail</div>
  <div id="sb-main">main</div>
</div>
<div sl-with-sidebar id="sb2" style="width:800px">
  <div sl-sidebar sl-place="end" id="sb-r2">r2</div>
  <div sl-sidebar sl-place="start" id="sb-r1">r1</div>
  <div>m</div>
</div>

<div id="probe"></div>
<pre id="results"></pre>
<script>
const R = [];
const $ = id => document.getElementById(id);
const cs = (el, p) => getComputedStyle($(el)).getPropertyValue(p);
const px = v => parseFloat(v);
const rect = id => $(id).getBoundingClientRect();
const rec = (name, got, want, ok) => R.push({ name, got: String(got), want: String(want), ok });
const eq = (name, got, want) => rec(name, got, want, got === want);
const near = (name, got, want, tol = 1.5) => rec(name, got, want + '±' + tol, Math.abs(px(got) - px(want)) <= tol);
const neq = (name, got, bad) => rec(name, got, 'not ' + bad, got !== bad);
const probe = $('probe');
const varPx = name => { probe.style.height = `var(${name},0px)`; return probe.getBoundingClientRect().height; };
const tracks = el => cs(el, 'grid-template-columns').split(' ').filter(s => s.endsWith('px')).length;
/* fixed-position anchors resolve against the layout viewport, which
   excludes the scrollbar — documentElement.client* matches it */
const vw = () => document.documentElement.clientWidth;
const vh = () => document.documentElement.clientHeight;

function main() {
  /* ---- container ---- */
  near('container def max-w = --sl-container-md', cs('cont-def', 'max-width'), varPx('--sl-container-md'));
  near('container sm max-w = --sl-container-sm', cs('cont-sm', 'max-width'), varPx('--sl-container-sm'));
  near('container lg max-w = --sl-container-lg', cs('cont-lg', 'max-width'), varPx('--sl-container-lg'));
  rec('container centered', cs('cont-def', 'margin-left') + ' / ' + cs('cont-def', 'margin-right'), 'equal >0',
    px(cs('cont-def', 'margin-left')) > 0 && cs('cont-def', 'margin-left') === cs('cont-def', 'margin-right'));

  /* ---- stack ---- */
  eq('stack display', cs('st-def', 'display'), 'flex');
  eq('stack column', cs('st-def', 'flex-direction'), 'column');
  near('stack def gap = --sl-md', cs('st-def', 'row-gap'), varPx('--sl-md'));
  eq('stack child margin zeroed', cs('st-c1', 'margin-top'), '0px');
  near('stack xs gap = --sl-xs', cs('st-xs', 'row-gap'), varPx('--sl-xs'));
  near('stack sm gap = --sl-sm', cs('st-sm', 'row-gap'), varPx('--sl-sm'));
  near('stack md gap = --sl-md', cs('st-md', 'row-gap'), varPx('--sl-md'));
  near('stack lg gap = --sl-lg', cs('st-lg', 'row-gap'), varPx('--sl-lg'));
  near('stack xl gap = --sl-xl', cs('st-xl', 'row-gap'), varPx('--sl-xl'));
  near('stack 2xl gap = --sl-2xl', cs('st-2xl', 'row-gap'), varPx('--sl-2xl'));
  near('stack 3xl gap = --sl-3xl', cs('st-3xl', 'row-gap'), varPx('--sl-3xl'));
  near('stack 4xl gap = --sl-4xl', cs('st-4xl', 'row-gap'), varPx('--sl-4xl'));
  near('stack 5xl gap = --sl-5xl', cs('st-5xl', 'row-gap'), varPx('--sl-5xl'));
  near('stack sl-gap=2xl slot', cs('st-gap', 'row-gap'), varPx('--sl-2xl'));
  /* @property seal — nested bare stack falls back to md, not the lg it would inherit */
  near('nested stack sealed to md', cs('st-inner', 'row-gap'), varPx('--sl-md'));
  neq('nested stack not lg', cs('st-inner', 'row-gap'), cs('st-lg', 'row-gap'));
  /* generic --sl-gap is a plain var: it IS meant to inherit in */
  near('ancestor sl-gap inherits in', cs('st-inherit', 'row-gap'), varPx('--sl-xl'));
  eq('flow display block', cs('st-flow', 'display'), 'block');
  near('flow sibling gap', cs('fl-2', 'margin-top'), varPx('--sl-md'));
  eq('flow first no margin', cs('fl-1', 'margin-top'), '0px');
  eq('stack cols display block', cs('st-cols', 'display'), 'block');
  eq('stack cols count', cs('st-cols', 'column-count'), '3');

  /* ---- row ---- */
  eq('row display', cs('row-def', 'display'), 'flex');
  eq('row wrap', cs('row-def', 'flex-wrap'), 'wrap');
  eq('row align center', cs('row-def', 'align-items'), 'center');
  near('row def gap = --sl-md', cs('row-def', 'column-gap'), varPx('--sl-md'));
  near('row lg gap = --sl-lg', cs('row-lg', 'column-gap'), varPx('--sl-lg'));
  eq('row zones switch to grid', cs('row-z', 'display'), 'grid');
  near('row center zone pinned', rect('rz-c').left + rect('rz-c').width / 2, rect('row-z').left + rect('row-z').width / 2, 2);
  near('row end zone at right', rect('rz-e').right, rect('row-z').right, 2);
  near('row start zone at left', rect('rz-s').left, rect('row-z').left, 2);

  /* ---- grid ---- */
  eq('grid display', cs('gr-auto', 'display'), 'grid');
  eq('grid auto-fill tracks = 2 @640px', tracks('gr-auto'), 2);
  eq('grid cols=4 tracks', tracks('gr-4'), 4);
  near('span 8 clamps to 4 tracks', rect('sp8').width, rect('gr-span').width, 2);
  near('span full covers grid', rect('spf').width, rect('gr-span').width, 2);
  rec('span 2 = 2 tracks + 1 gap', rect('sp2').width + 'px', '~(640-3*12)/4*2+12',
    Math.abs(rect('sp2').width - (2 * ((640 - 3 * varPx('--sl-md')) / 4) + varPx('--sl-md'))) < 2);
  /* self-default seal — inner bare grid must not inherit the parent's cols */
  eq('inner grid auto-fill 1 track', tracks('gr-inner'), 1);
  neq('inner grid != parent tracks', tracks('gr-inner'), tracks('gr-outer'));
  eq('outer grid tracks = 2', tracks('gr-outer'), 2);

  /* ---- bar ---- */
  eq('bar display grid', cs('bar-plain', 'display'), 'grid');
  near('bar min-block = 3.5rem', cs('bar-plain', 'min-height'), 56);
  near('bar pad = --sl-md block', cs('bar-plain', 'padding-top'), varPx('--sl-md'));
  eq('bar top sticky', cs('bar-top', 'position'), 'sticky');
  eq('bar top border-bottom', cs('bar-top', 'border-bottom-width'), '1px');
  near('bar center zone pinned', rect('bz-c').left + rect('bz-c').width / 2, rect('bar-top').left + rect('bar-top').width / 2, 2);
  near('bar end zone at right-pad', rect('bz-e').right, rect('bar-top').right - varPx('--sl-lg'), 2);
  near('bar start zone at left+pad', rect('bz-s').left, rect('bar-top').left + varPx('--sl-lg'), 2);
  eq('bar fixed', cs('bar-fix', 'position'), 'fixed');
  eq('bar static override', cs('bar-stat', 'position'), 'static');
  eq('bar bottom sticky', cs('bar-bot', 'position'), 'sticky');
  eq('bar bottom border-top', cs('bar-bot', 'border-top-width'), '1px');

  /* ---- toast ---- */
  eq('toast fixed', cs('t-def', 'position'), 'fixed');
  near('toast width 22rem', rect('t-def').width, Math.min(352, vw() - 32), 2);
  near('toast def bottom-end right', rect('t-def').right, vw() - varPx('--sl-lg'), 2);
  near('toast def bottom-end bottom', rect('t-def').bottom, vh() - varPx('--sl-lg'), 2);
  near('toast bottom-start left', rect('t-bs').left, varPx('--sl-lg'), 2);
  near('toast bottom-start bottom', rect('t-bs').bottom, vh() - varPx('--sl-lg'), 2);
  near('toast bottom-center x', rect('t-bc').left + rect('t-bc').width / 2, vw() / 2, 2);
  near('toast bottom-center bottom', rect('t-bc').bottom, vh() - varPx('--sl-lg'), 2);
  near('toast bottom-end right', rect('t-be').right, vw() - varPx('--sl-lg'), 2);
  near('toast top-start left', rect('t-ts').left, varPx('--sl-lg'), 2);
  near('toast top-start top', rect('t-ts').top, varPx('--sl-lg'), 2);
  near('toast top-center x', rect('t-tc').left + rect('t-tc').width / 2, vw() / 2, 2);
  near('toast top-center top', rect('t-tc').top, varPx('--sl-lg'), 2);
  near('toast top-end right', rect('t-te').right, vw() - varPx('--sl-lg'), 2);
  near('toast top-end top', rect('t-te').top, varPx('--sl-lg'), 2);
  near('toast legacy start = bottom-start', rect('t-legacy').left, varPx('--sl-lg'), 2);
  near('toast legacy bottom', rect('t-legacy').bottom, vh() - varPx('--sl-lg'), 2);

  /* ---- place ---- */
  near('place end margin-left auto', cs('pl-end', 'margin-left'), 420);
  near('place end pins right', rect('pl-end').right, rect('pl-wrap').right, 1);
  near('place start margin-right auto', cs('pl-start', 'margin-right'), 420);
  near('place start pins left', rect('pl-start').left, rect('pl-wrap').left, 1);
  near('place center margin-left', cs('pl-center', 'margin-left'), 210);
  near('place center pins middle', rect('pl-center').left + 40, rect('pl-wrap').left + 250, 1);
  near('place middle-end vcentered', rect('pl-me').top + 20, rect('pl-stack').top + 100, 2);
  near('place middle-end right', rect('pl-me').right, rect('pl-stack').right, 1);
  near('place bottom pushed down', rect('pl-bot').bottom, rect('pl-stack2').bottom, 1);

  /* ---- sidebar ---- */
  eq('with-sidebar flex', cs('sb', 'display'), 'flex');
  eq('with-sidebar wrap', cs('sb', 'flex-wrap'), 'wrap');
  near('sidebar rail 16rem', rect('sb-rail').width, 256, 4);
  near('sidebar def gap = --sl-lg', cs('sb', 'column-gap'), varPx('--sl-lg'));
  eq('place start order -1', cs('sb-r1', 'order'), '-1');
  eq('place end order 1', cs('sb-r2', 'order'), '1');
  eq('sidebar place margin zeroed', cs('sb-r1', 'margin-left'), '0px');
}

/* rAF is flaky under --virtual-time-budget (no frames without rendering),
   so a plain timer drives the run; both paths converge on go(). */
function go() {
  R.length = 0;
  try { main(); } catch (e) { R.push({ name: 'fixture threw', got: String(e && e.stack || e), want: 'no throw', ok: false }); }
  $('results').textContent = JSON.stringify(R);
  document.documentElement.setAttribute('data-done', '');
  labelize();
}
/* post-assertion pass: floating id chips at each element's rect so
   --screenshot output reads as a labeled contact sheet. Absolute
   positioning keeps layout — and every assertion — untouched. */
function labelize() {
  document.querySelectorAll('.tl').forEach(n => n.remove());
  if (!document.getElementById('tl-style')) {
    const st = document.createElement('style');
    st.id = 'tl-style';
    st.textContent = '.tl{position:absolute;z-index:2147483647;font:600 10px/1.5 ui-monospace,monospace;color:#fff;background:rgba(15,15,20,.62);padding:0 4px;border-radius:3px;pointer-events:none;white-space:nowrap}';
    document.head.append(st);
  }
  for (const el of document.querySelectorAll('[id]')) {
    if (el.id === 'results' || el.id === 'probe' || el.id === 'tl-style') continue;
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    const tag = document.createElement('i');
    tag.className = 'tl';
    tag.textContent = el.id;
    tag.style.left = Math.max(0, r.left + scrollX) + 'px';
    tag.style.top = Math.max(0, r.top + scrollY) + 'px';
    document.body.append(tag);
  }
  $('results').style.display = 'none';
  document.documentElement.setAttribute('data-h', Math.ceil(document.documentElement.scrollHeight));
}
setTimeout(go, 0);
requestAnimationFrame(() => setTimeout(go, 0));
</script>
</body>
</html>
