<!doctype html>
<html>
<body>
<i sl-icon="t:box" id="before"></i>
<i sl-icon="late:x" id="waiting"></i>
<script type="module">
import {
  icon, registerPack, registerResolver, resolve, resolveIcons,
} from '/packages/core/dist/index.min.js';

const results = [];
const t = (name, pass, note = '') => results.push({ name, pass: !!pass, note });
const nextTick = () => new Promise(r => setTimeout(r, 0));

await registerPack('t', { icons: { box: { body: '<path d="M0 0h1z"/>' }, star: { body: '<g/>' } } });

const before = document.getElementById('before');
t('placeholder fills on pack registration',
  before.querySelector('svg[sl-icon]') !== null && before.getAttribute('data-sl-resolved') === 't:box');
t('placeholder for an unregistered pack stays empty',
  document.getElementById('waiting').innerHTML === '');

const added = document.createElement('i');
added.setAttribute('sl-icon', 't:star');
document.body.appendChild(added);
await nextTick();
t('observer fills icons added after install', added.querySelector('svg[sl-icon]') !== null);

before.setAttribute('sl-icon', 't:star');
await nextTick();
t('attribute change re-resolves the icon',
  before.querySelector('svg > g') !== null && before.getAttribute('data-sl-resolved') === 't:star');

await registerPack('late', { icons: { x: { body: '<i/>' } } });
t('a late pack reaches waiting placeholders',
  document.getElementById('waiting').getAttribute('data-sl-resolved') === 'late:x');

await registerPack('net', '/tests/e2e/packs/net.json');
t('registerPack loads iconify data over fetch', icon('net:r').includes('<svg'));

const seen = [];
const holder = document.createElement('i');
document.body.appendChild(holder);
await nextTick();
registerResolver('sl-late', el => seen.push(el));
holder.setAttribute('sl-late', 'x');
await nextTick();
t('post-install attr mutations are filtered out', seen.length === 0);
resolve(document);
t('explicit resolve reaches late registrations', seen[0] === holder);

const host = document.createElement('div');
document.body.appendChild(host);
host.attachShadow({ mode: 'open' });
host.shadowRoot.innerHTML = '<i sl-icon="t:box"></i>';
await nextTick();
const shadowI = host.shadowRoot.querySelector('i');
t('observer does not enter shadow roots', shadowI.querySelector('svg') === null);
resolveIcons(host.shadowRoot);
t('resolveIcons fills inside a shadow root', shadowI.querySelector('svg[sl-icon]') !== null);

const pre = document.createElement('pre');
pre.id = 'e2e-results';
pre.hidden = true;
pre.textContent = JSON.stringify(results);
document.body.appendChild(pre);
</script>
</body>
</html>
