name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect prepared version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^1:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [[ "$version" == "$previous" ]]; then
            echo "No version change; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          for (const p of ['core', 'layout', 'theme']) {
            assert.equal(JSON.parse(readFileSync(`packages/${p}/package.json`, 'utf8')).version, version);
          }
          assert.equal(readdirSync('.changeset').filter(p => p.endsWith('.md') && p !== 'README.md').length, 0);
          NODE
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=sakulime-ui@$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
        if: steps.version.outputs.publish == 'true'
      - run: node --test tests/release-workflow.test.mjs
        if: steps.version.outputs.publish == 'true'
      - run: npm run build
        if: steps.version.outputs.publish == 'true'
      - name: Install chrome-headless-shell
        if: steps.version.outputs.publish == 'true'
        run: npx -y @puppeteer/browsers install chrome-headless-shell@stable --path /tmp/chromium
      - name: Fixture assertions
        if: steps.version.outputs.publish == 'true'
        run: SL_CHROMIUM=$(find /tmp/chromium -name chrome-headless-shell -type f | head -1) npm test
      - name: Publish prepared packages
        if: steps.version.outputs.publish == 'true'
        run: |
          tag="$RELEASE_TAG"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            echo "$tag already tagged; skipping npm publish."
          else
            npm run release
          fi
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          tag="sakulime-ui@$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released; skipping."
            exit 0
          fi
          git rev-parse --verify "refs/tags/$tag"
          git push origin "$tag"
          notes=$(awk -v v="$version" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
