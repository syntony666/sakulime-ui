name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect prepared version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^1:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [[ "$version" == "$previous" ]]; then
            echo "No version change; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          for (const p of ['core', 'layout', 'theme']) {
            assert.equal(JSON.parse(readFileSync(`packages/${p}/package.json`, 'utf8')).version, version);
          }
          assert.equal(readdirSync('.changeset').filter(p => p.endsWith('.md') && p !== 'README.md').length, 0);
          NODE
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=sakulime-ui@$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-pipeline.yml
    with:
      test: "false"

  publish:
    name: Release
    needs: [detect, verify]
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish prepared packages
        run: |
          tag="$RELEASE_TAG"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            echo "$tag already tagged; skipping npm publish."
          else
            npx --no-install changeset publish
          fi
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Create GitHub release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="sakulime-ui@$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released; skipping."
            exit 0
          fi
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag missing after publish; tagging $GITHUB_SHA"
            git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          fi
          git push origin "$tag"
          notes=$(awk -v v="$version" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
