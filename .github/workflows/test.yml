name: Test

on:
  push:
    branches:
      - master
      - 'release/*'
  pull_request:

jobs:
  test:
    name: Fixture assertions
    # changeset-release PRs are generated from an already-tested tree and
    # their runs always sit at action_required — skip keeps the check green
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Isolated-workspace deps guard
        run: node -e 'for (const p of ["doc/package.json", "packages/core/package.json"]) { const d = require("./" + p); if (!d.devDependencies?.["postcss-custom-selectors"]) throw new Error(p + " must declare postcss-custom-selectors — isolated builds never see root devDeps") }'
      - run: npm run lint
      - run: npm run build
      - name: Install chrome-headless-shell
        run: npx -y @puppeteer/browsers install chrome-headless-shell@stable --path /tmp/chromium
      - name: Fixture assertions
        run: SL_CHROMIUM=$(find /tmp/chromium -name chrome-headless-shell -type f | head -1) npm test
      - name: Docs site build
        run: npm run site
