name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: test-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/test-pipeline.yml
    with:
      lint: "true"
      site: "true"

  preview:
    name: Docs Preview
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: doc/site
      - name: Find open PR for Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          prs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$PR_BRANCH")"
          number="$(jq -r \
            --arg repo "$GITHUB_REPOSITORY" --arg branch "$PR_BRANCH" \
            --arg sha "$PR_HEAD_SHA" --argjson number "$PR_NUMBER" \
            '[.[] | select(
              .state == "open" and .head.repo.full_name == $repo and
              .head.ref == $branch and .head.sha == $sha and
              ($number == 0 or .number == $number)
            )] | first | .number // empty' <<< "$prs")"
          if [[ -z "$number" ]]; then
            echo "No open same-repository PR at the tested revision; skipping Preview."
            exit 0
          fi
          echo "name=pr-$number" >> "$GITHUB_OUTPUT"
          echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Deploy docs Preview
        id: deploy
        if: ${{ steps.preview.outputs.name != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.preview.outputs.name }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-preview.jsonl"
          npx --no-install wrangler preview \
            --config "$GITHUB_WORKSPACE/doc/wrangler.toml" \
            --name "$PREVIEW_NAME" --json
          url="$(jq -er 'select(.preview_urls[0] | type == "string" and . != "") | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          printf '### Docs Preview\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish Preview status
        if: ${{ steps.deploy.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state=success -f context="Docs Preview" \
            -f target_url="$PREVIEW_URL" \
            -f description="Documentation preview"

  test:
    name: Fixture assertions
    needs: [verify, preview]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq .
          jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' <<< "$NEEDS" > /dev/null
