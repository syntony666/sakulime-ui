name: Start Release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release version x.y.z (empty = auto-detect the only release branch)"
        required: false
        type: string

concurrency:
  group: start-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate release source
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Run Start Release from master, using release_branch to select the source."
            exit 1
          fi
          version="${RELEASE_BRANCH#release/}"
          if [[ -z "$version" ]]; then
            refs=$(gh api "repos/$GH_REPO/git/matching-refs/heads/release/" \
              --jq '.[].ref | sub("refs/heads/"; "")')
            if [[ -z "$refs" ]]; then
              echo "::error::No release/* branch exists; pass release_branch."
              exit 1
            fi
            if [[ $(wc -l <<< "$refs") != 1 ]]; then
              echo "::error::Multiple release branches exist; pass release_branch to choose one:"
              echo "$refs"
              exit 1
            fi
            version="${refs#release/}"
            echo "Auto-detected release branch: release/$version"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_branch must be x.y.z or release/x.y.z."
            exit 1
          fi
          echo "RELEASE_BRANCH=release/$version" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare release PR
        run: |
          set -euo pipefail
          version="${RELEASE_BRANCH#release/}"
          target="changeset-release/$version"
          pr=$(gh pr list --head "$target" --base master --state all \
            --json state,url --jq '.[0] // empty')
          state="$(jq -r '.state // empty' <<< "$pr")"
          if [[ "$state" == MERGED ]]; then
            echo "::error::This release PR is already merged; use a new release branch."
            exit 1
          fi

          git fetch origin \
            "refs/heads/master:refs/remotes/origin/master" \
            "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          source=$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")
          if ! git merge-base --is-ancestor origin/master "$source"; then
            echo "::error::Sync the latest master into the source release branch before starting."
            exit 1
          fi

          existing=$(git ls-remote --heads origin "refs/heads/$target")
          if [[ "$state" == CLOSED ]]; then
            if [[ -n "$existing" ]]; then
              git push origin --delete "refs/heads/$target"
            fi
            existing=
            pr=
          fi
          if [[ -n "$existing" ]]; then
            git fetch origin "refs/heads/$target"
            git switch --detach FETCH_HEAD
            if [[ "$(git rev-parse HEAD^)" != "$source" ]]; then
              echo "::error::The source changed after preparation. Existing release commits are never overwritten."
              exit 1
            fi
          else
            git switch -C "$target" "$source"
            npm ci
            npx --no-install changeset version
            npm install --package-lock-only --ignore-scripts
          fi

          VERSION="$version" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          const paths = ['package.json', ...['core', 'layout', 'theme'].map(p => `packages/${p}/package.json`)];
          for (const path of paths) {
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            assert.equal(pkg.version, process.env.VERSION, `${path}: changesets must produce the target version`);
          }
          const pending = readdirSync('.changeset').filter(p => p.endsWith('.md') && p !== 'README.md');
          assert.equal(pending.length, 0, 'Unconsumed changesets remain');
          NODE

          if [[ -z "$existing" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- .changeset package.json package-lock.json CHANGELOG.md \
              packages/core/package.json packages/core/CHANGELOG.md \
              packages/layout/package.json packages/layout/CHANGELOG.md \
              packages/theme/package.json packages/theme/CHANGELOG.md
            git commit -m "chore: release $version"
            git push origin "HEAD:refs/heads/$target"
          fi
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --base master --head "$target" \
              --title "chore: release $version" \
              --body "Source: $RELEASE_BRANCH at $source. Includes the release changes, versions and changelogs. The maintainer must Approve and then Merge; auto-merge is not enabled.")
          else
            url=$(jq -r .url <<< "$pr")
          fi

          printf '## Release prepared\n\n[Review PR](%s)\n\nApprove and Merge manually after Fixture assertions passes.\n' \
            "$url" >> "$GITHUB_STEP_SUMMARY"
